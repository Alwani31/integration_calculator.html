<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple Integration Calculator</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mathjs/11.8.0/math.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: #f5f5f7;
            color: #333;
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
        }
        .container {
            background-color: #ffffff;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            width: 100%;
            max-width: 900px;
            padding: 24px;
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
        }
        @media (min-width: 768px) {
            .container {
                grid-template-columns: 320px 1fr;
            }
        }
        .controls {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
        h2 {
            margin-top: 0;
            color: #1d1d1f;
            font-size: 1.5rem;
        }
        .input-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }
        label {
            font-size: 0.85rem;
            font-weight: 600;
            color: #666;
        }
        input {
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 1rem;
            outline: none;
            transition: border-color 0.2s;
        }
        input:focus {
            border-color: #0071e3;
        }
        .result-box {
            margin-top: 10px;
            padding: 16px;
            background-color: #f0f7ff;
            border-left: 4px solid #0071e3;
            border-radius: 0 6px 6px 0;
        }
        .result-title {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            color: #0071e3;
            font-weight: bold;
            margin-bottom: 4px;
        }
        .result-value {
            font-size: 1.6rem;
            font-weight: 700;
            font-family: monospace;
        }
        .graph-container {
            position: relative;
            min-height: 300px;
            width: 100%;
        }
        .error {
            color: #ff3b30;
            font-size: 0.85rem;
            margin-top: 4px;
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    <div class="controls">
        <h2>Integration Calculator</h2>
        
        <div class="input-group">
            <label for="functionInput">Function f(x)</label>
            <input type="text" id="functionInput" value="x^2 - 2x">
            <div id="errorMsg" class="error">Invalid mathematical expression.</div>
        </div>

        <div class="input-group">
            <label for="lowerBound">Lower Bound (a)</label>
            <input type="number" id="lowerBound" value="0" step="any">
        </div>

        <div class="input-group">
            <label for="upperBound">Upper Bound (b)</label>
            <input type="number" id="upperBound" value="3" step="any">
        </div>

        <div class="result-box">
            <div class="result-title">Definite Integral Result</div>
            <div class="result-value" id="resultValue">0.0000</div>
        </div>
    </div>

    <div class="graph-container">
        <canvas id="myChart"></canvas>
    </div>
</div>

<script>
    let myChart = null;

    // Setting up the basic Event Listeners for Live Updates
    document.getElementById('functionInput').addEventListener('input', calculateAndPlot);
    document.getElementById('lowerBound').addEventListener('input', calculateAndPlot);
    document.getElementById('upperBound').addEventListener('input', calculateAndPlot);

    // Initial load
    window.addEventListener('DOMContentLoaded', () => {
        calculateAndPlot();
    });

    function calculateAndPlot() {
        const exprString = document.getElementById('functionInput').value;
        const a = parseFloat(document.getElementById('lowerBound').value);
        const b = parseFloat(document.getElementById('upperBound').value);
        const errorMsg = document.getElementById('errorMsg');

        if (isNaN(a) || isNaN(b)) return;

        try {
            // Compile the expression safely using math.js
            const parser = math.compile(exprString);
            errorMsg.style.display = 'none';

            // 1. Calculate Numerical Integration using Simpson's Rule
            const integrationResult = simpsonsRule(parser, a, b, 1000);
            document.getElementById('resultValue').innerText = integrationResult.toFixed(4);

            // 2. Generate Chart Data
            // We want to scope the window dynamic to the integration bounds
            const padding = Math.max(1, Math.abs(b - a) * 0.5);
            const startX = Math.min(a, b) - padding;
            const endX = Math.max(a, b) + padding;
            
            const steps = 200;
            const stepSize = (endX - startX) / steps;

            const backgroundData = []; // Full function curve
            const shadedData = [];     // Integrated region subset

            for (let i = 0; i <= steps; i++) {
                const x = startX + (i * stepSize);
                let y;
                try {
                    y = parser.evaluate({ x: x });
                } catch(e) {
                    y = null;
                }

                if (y !== null && !isNaN(y) && isFinite(y)) {
                    backgroundData.push({ x: x, y: y });

                    // Check if x falls inside the interval [a, b] for shading
                    const minBound = Math.min(a, b);
                    const maxBound = Math.max(a, b);
                    if (x >= minBound && x <= maxBound) {
                        shadedData.push({ x: x, y: y });
                    }
                }
            }

            // Ensure exact edges of bounds 'a' and 'b' are captured for cleaner filling
            try {
                shadedData.unshift({ x: a, y: parser.evaluate({ x: a }) });
                shadedData.push({ x: b, y: parser.evaluate({ x: b }) });
                shadedData.sort((m, n) => m.x - n.x);
            } catch(e) {}

            updateChart(backgroundData, shadedData, a, b);

        } catch (error) {
            // Show error styling if math.js cannot parse the expression
            errorMsg.style.display = 'block';
        }
    }

    // Standard Simpson's 1/3 Rule implementation for accurate fast numerical approximations
    function simpsonsRule(parser, a, b, n) {
        if (a === b) return 0;
        // Ensure even number of intervals
        if (n % 2 !== 0) n++; 
        
        const h = (b - a) / n;
        let sum = 0;

        try {
            sum += parser.evaluate({ x: a });
            sum += parser.evaluate({ x: b });

            for (let i = 1; i < n; i++) {
                const x = a + i * h;
                const y = parser.evaluate({ x: x });
                if (i % 2 === 0) {
                    sum += 2 * y;
                } else {
                    sum += 4 * y;
                }
            }
            return (h / 3) * sum;
        } catch (e) {
            return 0;
        }
    }

    function updateChart(fullCurve, shadedCurve, a, b) {
        const ctx = document.getElementById('myChart').getContext('2d');

        // Destroy old canvas instance if updating dynamically
        if (myChart) {
            myChart.destroy();
        }

        myChart = new Chart(ctx, {
            type: 'line',
            data: {
                datasets: [
                    {
                        label: 'Integrated Area',
                        data: shadedCurve,
                        borderColor: 'rgba(0, 113, 227, 0.4)',
                        backgroundColor: 'rgba(0, 113, 227, 0.2)',
                        fill: 'origin', // Shades the area between curve and X-axis
                        pointRadius: 0,
                        borderWidth: 1,
                        tension: 0.1,
                        z: 1
                    },
                    {
                        label: 'f(x)',
                        data: fullCurve,
                        borderColor: '#1d1d1f',
                        borderWidth: 2.5,
                        pointRadius: 0,
                        fill: false,
                        tension: 0.1,
                        z: 2
                    }
                ]
            },
            options: {
                responsive: true,
                maintainAspectRatio: false,
                scales: {
                    x: {
                        type: 'linear',
                        position: 'bottom',
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        title: {
                            display: true,
                            text: 'X Axis'
                        }
                    },
                    y: {
                        type: 'linear',
                        grid: {
                            color: 'rgba(0, 0, 0, 0.05)'
                        },
                        title: {
                            display: true,
                            text: 'Y Axis'
                        }
                    }
                },
                plugins: {
                    legend: {
                        display: false // Hide legend to keep layout clean like Desmos
                    },
                    tooltip: {
                        callbacks: {
                            label: function(context) {
                                return `(${context.parsed.x.toFixed(2)}, ${context.parsed.y.toFixed(2)})`;
                            }
                        }
                    }
                }
            }
        });
    }
</script>
</body>
</html>
